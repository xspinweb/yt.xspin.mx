services:
  postgres:
    image: postgres:16-alpine
    container_name: yt_xspin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yt_xspin
      POSTGRES_USER: yt_xspin
      POSTGRES_PASSWORD: yt_xspin_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yt_xspin -d yt_xspin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
